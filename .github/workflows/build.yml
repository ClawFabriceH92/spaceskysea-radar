name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signé)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease --no-daemon
        env:
          SPACESKYSEA_KEYSTORE_B64: ${{ secrets.SPACESKYSEA_KEYSTORE_B64 }}
          SPACESKYSEA_KEYSTORE_PASSWORD: ${{ secrets.SPACESKYSEA_KEYSTORE_PASSWORD }}
          SPACESKYSEA_KEY_ALIAS: ${{ secrets.SPACESKYSEA_KEY_ALIAS }}
          SPACESKYSEA_KEY_PASSWORD: ${{ secrets.SPACESKYSEA_KEY_PASSWORD }}

      - name: Prepare APK artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/spaceskysea-radar-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/spaceskysea-radar-v${VERSION}-debug.apk"
          # Fichier version.json pour l'auto-update (vérifié par l'app au lancement)
          echo "{\"version\": \"v${VERSION}\", \"apk_url\": \"https://github.com/ClawFabriceH92/spaceskysea-radar/releases/download/v${VERSION}/spaceskysea-radar-v${VERSION}.apk\"}" > dist/version.json
          ls -la dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SpaceSkySea Radar ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/version.json
          generate_release_notes: false
