name: Retag (maintenance ponctuelle)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Déplacer les tags vers l'historique réécrit
        run: |
          git tag -f v1.2.1 25a73e2d5f6307b44967147fba678893e3e9d5c6
          git tag -f v1.2.2 dc202e427750650874ff2f26bf5589e476480ac3
          git tag -f v1.2.3 01cf773e55d2558cfc684e9d216fa0f02d15298a
          git push -f origin v1.2.1 v1.2.2 v1.2.3
